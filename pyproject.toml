[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-project"
version = "1.0.0"
description = "A clean, real-time, cross-platform terminal system monitor by anzydev."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "anzydev", email = "136097103+anzydev@users.noreply.github.com" }
]
keywords = ["ad-project", "system-monitor", "terminal", "cli", "rich", "psutil", "dashboard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.scripts]
ad-project = "ad_project.cli:main"
admon = "ad_project.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
