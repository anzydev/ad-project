services:
  postgres:
    image: postgres:16-alpine
    container_name: ad-project-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ad_project
      POSTGRES_USER: ad_user
      POSTGRES_PASSWORD: ad_password
    ports:
      - "5432:5432"
    volumes:
      - ad-project-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ad_user -d ad_project"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ad-project-postgres-data:
